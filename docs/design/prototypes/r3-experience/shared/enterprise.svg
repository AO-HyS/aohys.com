<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,sans-serif;fill:#473C33}.small{font-size:24px}.label{font-size:34px;font-weight:600}.heading{font-size:62px;font-weight:500;letter-spacing:-1px}</style><rect width="1440" height="900" fill="#fff"/><title id="title">Solicitudes de corrección de datos</title><desc id="desc">Diagrama explicativo del flujo: solicitud, revisión, aprobación o rechazo e historial. No es una captura del sistema.</desc><text x="80" y="130" class="heading">De una solicitud a una decisión.</text><text x="80" y="182" class="small">Flujo de corrección de datos · esquema explicativo</text><path d="M370 450H570M870 450H1000M1000 320V600M1000 320H1070M1000 600H1070" fill="none" stroke="#473C33" stroke-width="2"/><rect x="80" y="345" width="310" height="205" rx="12" fill="#FEC868"/><text x="112" y="410" class="label">Solicitud</text><text x="112" y="470" class="small">El agente propone</text><text x="112" y="506" class="small">una corrección.</text><rect x="570" y="345" width="310" height="205" rx="12" fill="#FDA769"/><text x="602" y="410" class="label">Revisión</text><text x="602" y="470" class="small">Una persona revisa</text><text x="602" y="506" class="small">los cambios.</text><rect x="1070" y="253" width="285" height="132" rx="12" fill="#ABC270"/><text x="1102" y="330" class="label">Aprobación</text><rect x="1070" y="533" width="285" height="132" rx="12" fill="#FEC868"/><text x="1102" y="612" class="label">Rechazo</text><path d="M80 730H1360" stroke="#473C33" stroke-width="1"/><text x="80" y="788" class="small">Mi contribución: frontend y flujo de interacción.</text><text x="80" y="830" class="small">La aplicación conserva el historial de solicitudes y decisiones.</text></svg>