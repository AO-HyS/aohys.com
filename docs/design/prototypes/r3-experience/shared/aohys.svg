<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><style>text{font-family:Arial,sans-serif;fill:#473C33}.small{font-size:24px}.label{font-size:34px;font-weight:600}.heading{font-size:62px;font-weight:500;letter-spacing:-1px}</style><rect width="1440" height="900" fill="#fff"/><title id="title">Tres responsabilidades en AOHYS</title><desc id="desc">Sitio público en Astro, edición privada en React y contenido con Convex. Diagrama explicativo, no captura de interfaz.</desc><text x="80" y="130" class="heading">Un sitio. Tres responsabilidades.</text><text x="80" y="182" class="small">Arquitectura de AOHYS · esquema simplificado</text><rect x="80" y="305" width="392" height="350" rx="12" fill="#FEC868"/><text x="112" y="375" class="label">Sitio público</text><text x="112" y="424" class="small">Astro</text><text x="112" y="540" class="small">Proyectos y trayectoria.</text><text x="112" y="580" class="small">Rutas en cada idioma.</text><rect x="524" y="305" width="392" height="350" rx="12" fill="#ABC270"/><text x="556" y="375" class="label">Edición privada</text><text x="556" y="424" class="small">React</text><text x="556" y="540" class="small">Contenido administrable.</text><text x="556" y="580" class="small">Acceso autenticado.</text><rect x="968" y="305" width="392" height="350" rx="12" fill="#FDA769"/><text x="1000" y="375" class="label">Contenido</text><text x="1000" y="424" class="small">Convex</text><text x="1000" y="540" class="small">Borradores y publicación.</text><text x="1000" y="580" class="small">Permisos en el backend.</text><path d="M80 730H1360" stroke="#473C33" stroke-width="1"/><text x="80" y="793" class="small">El grafo de contenido relaciona páginas, idiomas, metadatos y evidencia.</text></svg>