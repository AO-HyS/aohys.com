# Codex preferences mirrored from the operator's machine; secrets stay in
# the agent host's secret store. Provisioned to $HOME/.codex/config.toml
# by the cloud environment blueprint.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "pragmatic"
approval_policy = "never"
sandbox_mode = "danger-full-access"
approvals_reviewer = "user"
service_tier = "priority"

[mcp_servers.expect]
command = "npx"
args = ["-y", "expect-cli@latest", "mcp"]
startup_timeout_sec = 30

[mcp_servers.auggie]
url = "https://api.augmentcode.com/mcp"

[mcp_servers.posthog]
url = "https://mcp.posthog.com/mcp"

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.mobbin]
url = "https://api.mobbin.com/mcp"

[mcp_servers.mercadopago-mcp-server]
url = "https://mcp.mercadopago.com/mcp"
