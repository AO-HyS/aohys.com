name: Release Train

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy from the dashboard publish action.
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      publication_request_key:
        description: Durable publication request correlation key.
        required: false
        type: string
      publication_attempt_id:
        description: Durable publication attempt correlation id.
        required: false
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: release-train-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
  cancel-in-progress: ${{ (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'preview') || (github.event_name == 'push' && github.ref == 'refs/heads/develop') }}

jobs:
  release-plan:
    name: Plan Release
    runs-on: ubuntu-latest
    outputs:
      deploy_runtime: ${{ steps.plan.outputs.deploy_runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Classify changed surfaces
        id: plan
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_BASE_SHA: ${{ github.event.before }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/quality/release-plan.mjs

  deploy-preview:
    name: Deploy Preview
    needs: release-plan
    runs-on: ubuntu-latest
    if: needs.release-plan.outputs.deploy_runtime == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'preview' && github.ref == 'refs/heads/develop'))
    environment: preview
    env:
      AOHYS_ENV: preview
      PUBLIC_RELEASE_SHA: ${{ github.sha }}
      VITE_RELEASE_SHA: ${{ github.sha }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
      CONVEX_URL: ${{ vars.CONVEX_URL }}
      CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
      CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      LEAD_NOTIFICATION_EMAIL: ${{ vars.LEAD_NOTIFICATION_EMAIL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      CLOUDFLARE_IMAGES_ACCOUNT_HASH: ${{ vars.CLOUDFLARE_IMAGES_ACCOUNT_HASH }}
      CLOUDFLARE_IMAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_API_TOKEN }}
      PUBLISH_GITHUB_REPOSITORY: ${{ vars.PUBLISH_GITHUB_REPOSITORY }}
      PUBLISH_GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
      PUBLISH_GITHUB_WORKFLOW_ID: ${{ vars.PUBLISH_GITHUB_WORKFLOW_ID }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      PUBLIC_WHATSAPP_URL: ${{ vars.PUBLIC_WHATSAPP_URL }}
      SMOKE_CONTACT_SUBMIT: ${{ vars.SMOKE_CONTACT_SUBMIT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install resume PDF dependencies
        run: python -m pip install --requirement apps/site/scripts/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit PostHog environment separation
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run audit:posthog-env

      - name: Audit Cloudflare Pages runtime bindings
        run: pnpm run audit:cloudflare-pages-runtime

      - name: Deploy Cloudflare Pages preview with sync:convex-env
        id: deploy-preview
        run: |
          set -o pipefail
          deploy_log="${RUNNER_TEMP}/aohys-preview-deploy.log"
          pnpm run deploy:preview | tee "${deploy_log}"
          smoke_base_url="$(pnpm exec tsx scripts/extract-cloudflare-pages-deployment-url.ts < "${deploy_log}")"
          echo "smoke_base_url=${smoke_base_url}" >> "${GITHUB_OUTPUT}"

      - name: Smoke preview
        env:
          SMOKE_BASE_URL: ${{ steps.deploy-preview.outputs.smoke_base_url }}
        run: pnpm run smoke:preview

      - name: Record verified preview publication receipt
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publication_attempt_id != ''
        env:
          PUBLICATION_REQUEST_KEY: ${{ inputs.publication_request_key }}
          PUBLICATION_ATTEMPT_ID: ${{ inputs.publication_attempt_id }}
          PUBLICATION_TARGET_ENVIRONMENT: preview
          PUBLICATION_GIT_REF: ${{ github.ref }}
          PUBLICATION_RUN_ID: ${{ github.run_id }}
          PUBLICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICATION_RELEASE_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/record-publication-receipt.ts

  deploy-production:
    name: Deploy Production
    needs: release-plan
    runs-on: ubuntu-latest
    if: needs.release-plan.outputs.deploy_runtime == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target_environment == 'production' && github.ref == 'refs/heads/main'))
    environment: production
    env:
      AOHYS_ENV: production
      PUBLIC_RELEASE_SHA: ${{ github.sha }}
      VITE_RELEASE_SHA: ${{ github.sha }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
      PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
      CONVEX_URL: ${{ vars.CONVEX_URL }}
      CONVEX_DEPLOYMENT: ${{ vars.CONVEX_DEPLOYMENT }}
      CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      LEAD_NOTIFICATION_EMAIL: ${{ vars.LEAD_NOTIFICATION_EMAIL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL }}
      BETTER_AUTH_TRUSTED_ORIGINS: ${{ vars.BETTER_AUTH_TRUSTED_ORIGINS }}
      ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      CLOUDFLARE_IMAGES_ACCOUNT_HASH: ${{ vars.CLOUDFLARE_IMAGES_ACCOUNT_HASH }}
      CLOUDFLARE_IMAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_IMAGES_API_TOKEN }}
      PUBLISH_GITHUB_REPOSITORY: ${{ vars.PUBLISH_GITHUB_REPOSITORY }}
      PUBLISH_GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
      PUBLISH_GITHUB_WORKFLOW_ID: ${{ vars.PUBLISH_GITHUB_WORKFLOW_ID }}
      PUBLIC_CONTACT_EMAIL: ${{ vars.PUBLIC_CONTACT_EMAIL }}
      PUBLIC_WHATSAPP_URL: ${{ vars.PUBLIC_WHATSAPP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install resume PDF dependencies
        run: python -m pip install --requirement apps/site/scripts/requirements.txt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit PostHog environment separation
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm run audit:posthog-env

      - name: Audit Cloudflare Pages runtime bindings
        run: pnpm run audit:cloudflare-pages-runtime

      - name: Deploy Cloudflare Pages production with sync:convex-env
        run: pnpm run deploy:production

      - name: Smoke production
        run: pnpm run smoke:production

      - name: Record verified production publication receipt
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publication_attempt_id != ''
        env:
          PUBLICATION_REQUEST_KEY: ${{ inputs.publication_request_key }}
          PUBLICATION_ATTEMPT_ID: ${{ inputs.publication_attempt_id }}
          PUBLICATION_TARGET_ENVIRONMENT: production
          PUBLICATION_GIT_REF: ${{ github.ref }}
          PUBLICATION_RUN_ID: ${{ github.run_id }}
          PUBLICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PUBLICATION_RELEASE_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/record-publication-receipt.ts

  reconcile-publication-outcome:
    name: Reconcile Publication Failure
    needs:
      - release-plan
      - deploy-preview
      - deploy-production
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publication_attempt_id != '' && ((inputs.target_environment == 'preview' && github.ref == 'refs/heads/develop' && (needs.release-plan.result == 'failure' || needs.release-plan.result == 'cancelled' || needs.deploy-preview.result == 'failure' || needs.deploy-preview.result == 'cancelled')) || (inputs.target_environment == 'production' && github.ref == 'refs/heads/main' && (needs.release-plan.result == 'failure' || needs.release-plan.result == 'cancelled' || needs.deploy-production.result == 'failure' || needs.deploy-production.result == 'cancelled')))
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      PUBLICATION_REQUEST_KEY: ${{ inputs.publication_request_key }}
      PUBLICATION_ATTEMPT_ID: ${{ inputs.publication_attempt_id }}
      PUBLICATION_TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      PUBLICATION_GIT_REF: ${{ github.ref }}
      PUBLICATION_RUN_ID: ${{ github.run_id }}
      PUBLICATION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      PUBLICATION_WORKFLOW_OUTCOME: ${{ (needs.release-plan.result == 'cancelled' || needs.deploy-preview.result == 'cancelled' || needs.deploy-production.result == 'cancelled') && 'cancelled' || 'failure' }}
    steps:
      - name: Checkout pinned release source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record terminal publication outcome
        run: pnpm exec tsx scripts/record-publication-outcome.ts
