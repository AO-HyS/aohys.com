<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Reviewable release lifecycle: intent, scoped implementation, independent verification, and human-approved promotion">
  <rect width="960" height="560" rx="16" fill="#fbf8f3"/>
  <rect x="24" y="24" width="912" height="512" rx="12" fill="#ffffff" stroke="#473c33" stroke-opacity="0.14"/>

  <text x="64" y="76" fill="#6a6058" font-family="Jost, system-ui, sans-serif" font-size="13" letter-spacing="1.6">AI-NATIVE ENGINEERING PRACTICE · RELEASE CYCLE</text>
  <text x="64" y="114" fill="#473c33" font-family="Spectral, Georgia, serif" font-size="30" font-weight="400">Reviewable releases with explicit human accountability</text>

  <!-- Gutter connectors between cards -->
  <g stroke="#473c33" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round">
    <line x1="254" y1="252" x2="276" y2="252"/>
    <line x1="468" y1="252" x2="490" y2="252"/>
    <line x1="682" y1="252" x2="704" y2="252"/>
  </g>

  <!-- 4 Stages -->
  <g font-family="Jost, system-ui, sans-serif" fill="#473c33">
    <rect x="64" y="168" width="188" height="168" rx="12" fill="#ffffff" stroke="#473c33" stroke-opacity="0.18"/>
    <rect x="64" y="168" width="188" height="168" rx="12" fill="#fce3a6" fill-opacity="0.45"/>
    <text x="84" y="200" font-size="12" fill="#6a6058">01 · Scope</text>
    <text x="84" y="232" font-size="20" font-family="Spectral, Georgia, serif">Intent &amp; rules</text>
    <text x="84" y="264" font-size="14" fill="#6a6058">Written criteria</text>
    <text x="84" y="286" font-size="14" fill="#6a6058">before any edit</text>
    <text x="84" y="316" font-size="12" fill="#473c33">Owner: Human</text>

    <rect x="278" y="168" width="188" height="168" rx="12" fill="#ffffff" stroke="#473c33" stroke-opacity="0.18"/>
    <rect x="278" y="168" width="188" height="168" rx="12" fill="#fdd2b1" fill-opacity="0.45"/>
    <text x="298" y="200" font-size="12" fill="#6a6058">02 · Build</text>
    <text x="298" y="232" font-size="20" font-family="Spectral, Georgia, serif">Scoped PR</text>
    <text x="298" y="264" font-size="14" fill="#6a6058">Lint, types &amp; build</text>
    <text x="298" y="286" font-size="14" fill="#6a6058">on every change</text>
    <text x="298" y="316" font-size="12" fill="#473c33">Owner: Agent + Review</text>

    <rect x="492" y="168" width="188" height="168" rx="12" fill="#ffffff" stroke="#473c33" stroke-opacity="0.18"/>
    <rect x="492" y="168" width="188" height="168" rx="12" fill="#d6e2b4" fill-opacity="0.45"/>
    <text x="512" y="200" font-size="12" fill="#6a6058">03 · Evidence</text>
    <text x="512" y="232" font-size="20" font-family="Spectral, Georgia, serif">Real checks</text>
    <text x="512" y="264" font-size="14" fill="#6a6058">Browser &amp; smoke</text>
    <text x="512" y="286" font-size="14" fill="#6a6058">on preview deploy</text>
    <text x="512" y="316" font-size="12" fill="#473c33">Owner: Fresh verifier</text>

    <rect x="706" y="168" width="190" height="168" rx="12" fill="#fbf8f3" stroke="#473c33" stroke-opacity="0.24"/>
    <text x="726" y="200" font-size="12" fill="#6a6058">04 · Release</text>
    <text x="726" y="232" font-size="20" font-family="Spectral, Georgia, serif">Promotion</text>
    <text x="726" y="264" font-size="14" fill="#6a6058">develop → main</text>
    <text x="726" y="286" font-size="14" fill="#6a6058">with rollback path</text>
    <text x="726" y="316" font-size="12" fill="#473c33">Owner: Human sign-off</text>
  </g>

  <!-- Bottom summary bar -->
  <rect x="64" y="384" width="832" height="104" rx="10" fill="#fbf8f3" stroke="#473c33" stroke-opacity="0.14"/>
  <text x="88" y="418" fill="#473c33" font-family="Spectral, Georgia, serif" font-size="19">Every merge leaves an auditable trail</text>
  <text x="88" y="448" fill="#6a6058" font-family="Jost, system-ui, sans-serif" font-size="15">Feature branch → static checks &amp; independent read → develop preview smoke → explicit human promotion to production.</text>
</svg>
