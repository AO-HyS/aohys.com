<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Flujo de sistemas enterprise: de entregas manuales en hojas de cálculo a solicitudes, revisión y auditoría trazables">
  <rect width="960" height="560" rx="16" fill="#fbf8f3"/>
  <rect x="24" y="24" width="912" height="512" rx="12" fill="#ffffff" stroke="#473c33" stroke-opacity="0.14"/>

  <text x="64" y="76" fill="#6a6058" font-family="Jost, system-ui, sans-serif" font-size="13" letter-spacing="1.6">OPERACIÓN ENTERPRISE · FLUJO ANONIMIZADO</text>
  <text x="64" y="114" fill="#473c33" font-family="Spectral, Georgia, serif" font-size="30" font-weight="400">De entregas manuales a flujo operativo auditable</text>

  <!-- Before lane -->
  <rect x="64" y="150" width="832" height="122" rx="10" fill="#fbf8f3" stroke="#473c33" stroke-opacity="0.14"/>
  <text x="88" y="182" fill="#6a6058" font-family="Jost, system-ui, sans-serif" font-size="13" letter-spacing="1.2">ANTES · PASOS MANUALES FRAGMENTADOS</text>
  <g font-family="Jost, system-ui, sans-serif" font-size="15" fill="#473c33">
    <rect x="88" y="200" width="224" height="52" rx="8" fill="#ffffff" stroke="#473c33" stroke-opacity="0.22"/>
    <text x="108" y="231">Hojas de cálculo aisladas</text>
    <path d="M312 226 H364" stroke="#6a6058" stroke-width="1.4" stroke-dasharray="4 4"/>
    <rect x="364" y="200" width="232" height="52" rx="8" fill="#ffffff" stroke="#473c33" stroke-opacity="0.22"/>
    <text x="384" y="231">Aprobaciones por correo</text>
    <path d="M596 226 H648" stroke="#6a6058" stroke-width="1.4" stroke-dasharray="4 4"/>
    <rect x="648" y="200" width="224" height="52" rx="8" fill="#ffffff" stroke="#473c33" stroke-opacity="0.22"/>
    <text x="668" y="231">Conciliación manual</text>
  </g>

  <!-- Arrow down -->
  <path d="M480 282 V318 M472 310 L480 318 L488 310" fill="none" stroke="#473c33" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- After lane -->
  <rect x="64" y="330" width="832" height="168" rx="10" fill="#ffffff" stroke="#473c33" stroke-opacity="0.2"/>
  <text x="88" y="362" fill="#473c33" font-family="Jost, system-ui, sans-serif" font-size="13" letter-spacing="1.2">DESPUÉS · SISTEMA ESTRUCTURADO DE SOLICITUD Y REVISIÓN</text>

  <g font-family="Jost, system-ui, sans-serif" fill="#473c33">
    <rect x="88" y="382" width="184" height="90" rx="10" fill="#fce3a6" fill-opacity="0.65" stroke="#473c33" stroke-opacity="0.2"/>
    <text x="106" y="408" font-size="12" fill="#6a6058">01 · Captura</text>
    <text x="106" y="432" font-size="16" font-family="Spectral, Georgia, serif">Solicitud validada</text>
    <text x="106" y="454" font-size="13" fill="#6a6058">Reglas y contexto</text>

    <path d="M272 427 H304" stroke="#473c33" stroke-width="1.4"/>

    <rect x="304" y="382" width="184" height="90" rx="10" fill="#fdd2b1" fill-opacity="0.65" stroke="#473c33" stroke-opacity="0.2"/>
    <text x="322" y="408" font-size="12" fill="#6a6058">02 · Revisión</text>
    <text x="322" y="432" font-size="16" font-family="Spectral, Georgia, serif">Aprobación por rol</text>
    <text x="322" y="454" font-size="13" fill="#6a6058">Responsable claro</text>

    <path d="M488 427 H520" stroke="#473c33" stroke-width="1.4"/>

    <rect x="520" y="382" width="184" height="90" rx="10" fill="#d6e2b4" fill-opacity="0.65" stroke="#473c33" stroke-opacity="0.2"/>
    <text x="538" y="408" font-size="12" fill="#6a6058">03 · Ejecución</text>
    <text x="538" y="432" font-size="16" font-family="Spectral, Georgia, serif">Decisión registrada</text>
    <text x="538" y="454" font-size="13" fill="#6a6058">Historial auditable</text>

    <path d="M704 427 H736" stroke="#473c33" stroke-width="1.4"/>

    <rect x="736" y="382" width="136" height="90" rx="10" fill="#fbf8f3" stroke="#473c33" stroke-opacity="0.22"/>
    <text x="752" y="408" font-size="12" fill="#6a6058">04 · Reporte</text>
    <text x="752" y="432" font-size="16" font-family="Spectral, Georgia, serif">Estado real</text>
    <text x="752" y="454" font-size="13" fill="#6a6058">Sin desfase</text>
  </g>
</svg>
